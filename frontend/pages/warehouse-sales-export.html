<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品仓库报表按月导出</title>
    <link rel="icon" type="image/png" href="../assets/logo.png" />
    <link rel="stylesheet" href="../assets/app.css?v=20260623-log-panel-20261110-warehouse-export" />
  </head>
  <body>
    <div class="app-shell">
      <aside id="appSidebar" class="sidebar"></aside>
      <main class="main warehouse-export-main">
        <header class="page-header">
          <div><div class="page-kicker">马帮流程 / 商品仓库报表 / 按月导出</div><h1>商品仓库报表按月导出</h1></div>
          <div id="taskBadge" class="status-pill idle">待运行</div>
        </header>
        <section class="overview-grid">
          <article class="overview-card accent-green"><span>当前流程</span><strong>按月分表导出</strong><small>马帮 ERP · 商品仓库报表</small></article>
          <article class="overview-card"><span>已选分类 / 仓库</span><strong id="categoryCount">0 / 0</strong><small>自定义分类 / 仓库</small></article>
          <article class="overview-card"><span>数据行数</span><strong id="recordCount">0</strong><small>任务完成后更新</small></article>
          <article class="overview-card file-card"><span>输出文件</span><strong id="outputFile">未生成</strong><small id="statusText">等待任务启动</small></article>
        </section>
        <section class="layout-grid warehouse-export-layout">
          <form id="warehouseExportForm" class="surface form-surface warehouse-export-surface">
            <div class="section-head"><div><h2>商品仓库报表按月导出</h2><p>多选分类与仓库后按月导出，每月一个工作表合并成一张表；两个维度至少选一项，同维取并集、跨维取交集。</p></div><span class="section-badge">马帮 ERP</span></div>
            <div class="flow-account-bar">
              <span class="flow-account-icon">M</span><span class="flow-account-copy"><small>本次运行账号</small><strong data-active-account-name data-vendor="mabang">尚未绑定马帮账号</strong></span>
              <a class="account-link-button" href="settings.html?focus=mabang">管理账号</a>
            </div>
            <div class="form-grid">
              <label><span>开始月份</span><input id="warehouseStartMonth" type="month" /></label>
              <label><span>结束月份</span><input id="warehouseEndMonth" type="month" /></label>
              <div class="group-field warehouse-filter-grid">
                <div class="developer-panel">
                  <div class="developer-panel-head">
                    <div><strong>自定义分类</strong><small id="categorySummary" role="status" aria-live="polite">准备加载分类</small></div>
                    <button id="reloadCategoriesBtn" class="secondary compact-btn" type="button">重新加载</button>
                  </div>
                  <label class="developer-search-field"><span>搜索分类</span><input id="categorySearch" type="search" placeholder="分类名称或 ID" autocomplete="off" aria-controls="categorySelect" /></label>
                  <div class="developer-selection-actions">
                    <button id="selectAllCategoriesBtn" class="secondary compact-btn" type="button">全选全部分类</button>
                    <button id="clearCategoriesBtn" class="secondary compact-btn" type="button">清空选择</button>
                  </div>
                  <div id="categorySelect" class="developer-checklist" role="group" aria-label="自定义分类列表"></div>
                </div>
                <div class="developer-panel">
                  <div class="developer-panel-head">
                    <div><strong>仓库</strong><small id="warehouseSummary" role="status" aria-live="polite">准备加载仓库</small></div>
                    <button id="reloadWarehousesBtn" class="secondary compact-btn" type="button">重新加载</button>
                  </div>
                  <label class="developer-search-field"><span>搜索仓库</span><input id="warehouseSearch" type="search" placeholder="仓库名称或 ID" autocomplete="off" aria-controls="warehouseSelect" /></label>
                  <div class="developer-selection-actions">
                    <button id="selectAllWarehousesBtn" class="secondary compact-btn" type="button">全选全部仓库</button>
                    <button id="clearWarehousesBtn" class="secondary compact-btn" type="button">清空选择</button>
                  </div>
                  <div id="warehouseSelect" class="developer-checklist" role="group" aria-label="仓库列表"></div>
                </div>
              </div>
            </div>
            <div class="actions">
              <button id="warehouseRunBtn" class="primary" type="submit">按月导出</button>
              <button id="warehouseOpenOutputBtn" class="secondary" type="button" disabled>打开输出目录</button>
            </div>
          </form>
          <div class="right-stack">
            <section class="surface log-surface">
              <div class="section-head tight">
                <div><h2>运行日志</h2><p>后台任务实时输出</p></div>
                <button id="copyLogBtn" class="secondary compact-btn" type="button" aria-label="复制全部运行日志">复制日志</button>
              </div>
              <pre id="logBox" class="log-box" tabindex="0"></pre>
            </section>
          </div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast hidden"></div>
    <script src="../assets/common.js?v=20261110-warehouse-export"></script>
    <script src="../assets/pages/warehouse-sales-export.js?v=20261110-warehouse-export"></script>
  </body>
</html>
