<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>菲律宾各组销量报表</title>
    <link rel="icon" type="image/png" href="../assets/logo.png" />
    <link rel="stylesheet" href="../assets/app.css?v=20260623-log-panel" />
  </head>
  <body>
    <div class="app-shell">
      <aside id="appSidebar" class="sidebar"></aside>
      <main class="main">
        <header class="page-header">
          <div><div class="page-kicker">马帮流程 / 菲律宾 Shopee / 销量报表</div><h1>菲律宾各组销量报表</h1></div>
          <div id="taskBadge" class="status-pill idle">待运行</div>
        </header>
        <section class="overview-grid">
          <article class="overview-card accent-green"><span>当前流程</span><strong>小组销量导出</strong><small>马帮 ERP</small></article>
          <article class="overview-card"><span>小组数</span><strong id="skuCount">0</strong><small>已选择小组数量</small></article>
          <article class="overview-card"><span>商品行数</span><strong id="recordCount">0</strong><small>任务完成后更新</small></article>
          <article class="overview-card file-card"><span>输出文件</span><strong id="outputFile">未生成</strong><small id="statusText">等待任务启动</small></article>
        </section>
        <section class="layout-grid">
          <form id="groupSalesForm" class="surface form-surface">
            <div class="section-head"><div><h2>菲律宾各组销量报表</h2><p>选择小组和付款时间范围后，导出 CSV 明细并生成汇总 Excel。</p></div><span class="section-badge">菲律宾 Shopee</span></div>
            <div class="flow-account-bar">
              <span class="flow-account-icon">M</span><span class="flow-account-copy"><small>本次运行账号</small><strong data-active-account-name data-vendor="mabang">尚未绑定马帮账号</strong></span>
              <a class="account-link-button" href="settings.html?focus=mabang">管理账号</a>
            </div>
            <div class="form-grid">
              <label><span>开始日期</span><input id="groupStartDate" type="date" /></label>
              <label><span>结束日期</span><input id="groupEndDate" type="date" /></label>
              <label class="group-field"><span>小组</span><select id="salesGroupSelect" multiple size="8"></select><small class="form-note">可按住 Ctrl 多选；未保存过时默认选中第一个小组。</small></label>
            </div>
            <div class="actions">
              <button id="groupRunBtn" class="primary" type="submit">导出销量报表</button>
              <button id="selectAllGroupsBtn" class="secondary" type="button">全选小组</button>
              <button id="clearGroupsBtn" class="secondary" type="button">清空小组</button>
              <button id="groupOpenOutputBtn" class="secondary" type="button" disabled>打开输出目录</button>
            </div>
          </form>
          <div class="right-stack">
            <section class="surface log-surface">
              <div class="section-head tight">
                <div><h2>运行日志</h2><p>后台任务实时输出</p></div>
                <button id="copyLogBtn" class="secondary compact-btn" type="button" aria-label="复制全部运行日志">复制日志</button>
              </div>
              <pre id="logBox" class="log-box" tabindex="0"></pre>
            </section>
          </div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast hidden"></div>
    <script src="../assets/common.js?v=20260623-log-panel"></script>
    <script src="../assets/pages/group-sales.js?v=20260623-multipage"></script>
  </body>
</html>
