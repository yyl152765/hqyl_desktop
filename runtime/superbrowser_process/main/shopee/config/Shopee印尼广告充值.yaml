    personal_code_system_name: 【{shop_name}】广告充值金额：{recharge_amount}，个人安全码接收
    timeout: 300
    poll_interval: 5
    auto_mark_sent: true
dingtalk:
  doc_config:
    config_sheet: 印尼
    success_log_sheet_name_format: '%Y-%m-%d'
