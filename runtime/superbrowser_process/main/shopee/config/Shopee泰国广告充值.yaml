task:
- th_shopee_ads_recharge
thread_num: 3
database:
  FIELD_MAPPING:
    browserIp: browser_ip
    browserName: browser_name
    browserOauth: browser_oauth
    isDynamic: is_dynamic
    isExpired: is_expired
    proxyType: proxy_type
    siteId: site_id
    platform_id: platform_id
    platform_name: platform_name
    store_username: store_username
    tags: tags
shopee:
  recharge_amount: 100
  timeout: 60
  ads_wallet_url: https://seller.shopee.co.th/portal/marketing/pas/index
  security_verify:
    enabled: true
    base_url: http://rpa.whhqyl.com.cn:8090
    dynamic_code_system_name: 【{shop_name}】广告充值金额：{recharge_amount}，动态验证码接收
    personal_code_enabled: true
    personal_code_system_name: 【{shop_name}】广告充值金额：{recharge_amount}，个人安全码接收
    world_email_code_system_name: 【{shop_name}】WORLD邮箱验证码接收（{masked_email}）
    timeout: 300
    poll_interval: 5
    auto_mark_sent: true
  world_card_sms:
    platform_name: 万里汇
    merchant_keyword: FOR SHOPEE
    merchant_keywords:
    - FOR SHOPEE
    - TH SHOPEE MARKETPLACE
    - SHOPEE
    auth_button_timeout: 180
    timeout: 180
    poll_interval: 3
dingtalk:
  doc_config:
    config_sheet: 泰国
    custom_recharge_status_sheet: Sheet1
    custom_recharge_operator_name: ''
